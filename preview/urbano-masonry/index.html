<style>
  :root { --accent:#FFC20E; --ink:#1C1D1F; --paper:#F4F4F2; --soft:#D9D8D3; --muted:#5C5E62; --line:#C4C3BE; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:"Barlow", system-ui, sans-serif; color:var(--ink); background:var(--paper); font-size:17px; line-height:1.55; }
  img { display:block; max-width:100%; }
  a { color:inherit; }
  .wrap { width:min(1200px, 100% - 32px); margin-inline:auto; }
  h1,h2,h3 { font-family:"Barlow Condensed", Impact, sans-serif; font-weight:800; text-transform:uppercase; line-height:.95; margin:0; letter-spacing:.005em; }
  h2 { font-size:clamp(40px, 7vw, 68px); margin-bottom:30px; }
  section { padding:72px 0; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

  .btns { display:flex; flex-wrap:wrap; gap:10px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:15px 22px; text-decoration:none; border:0; font:inherit; font-weight:600; cursor:pointer; min-height:54px; border-radius:0; }
  .btn svg { width:20px; height:20px; flex:none; }
  .btn-call { background:var(--accent); color:var(--ink); }
  .btn-wa { background:#fff; color:var(--ink); }
  .btn-wa svg { color:#1FA855; }
  .btn:hover { filter:brightness(1.05); }

  .site-header { background:var(--ink); color:#fff; border-bottom:6px solid var(--accent); }
  .site-header .wrap { display:flex; align-items:center; justify-content:space-between; height:64px; gap:12px; }
  .logo { font-family:"Barlow Condensed", Impact, sans-serif; font-weight:800; text-transform:uppercase; font-size:24px; text-decoration:none; margin:0; line-height:1; }
  .head-actions { display:flex; align-items:center; gap:14px; }
  .lang { background:transparent; color:#fff; border:1.5px solid #fff; padding:7px 12px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .head-call { display:none; align-items:center; gap:6px; color:var(--accent); font-weight:600; text-decoration:none; }
  .head-call svg { width:18px; height:18px; }

  .hero { background:var(--ink); color:#fff; display:flex; flex-direction:column; padding:0; }
  .hero-body { order:1; padding:40px 0 44px; }
  .hero-media { order:2; position:relative; }
  .hero-media img { width:100%; aspect-ratio:16/10; object-fit:cover; }
  .hero-media::before { content:""; position:absolute; inset:0 0 auto; height:14px; z-index:1;
    background:repeating-linear-gradient(-45deg, var(--accent) 0 18px, var(--ink) 18px 36px); }
  .hero-kicker { color:var(--accent); font-weight:600; margin:0 0 12px; }
  .hero h1 { font-size:clamp(54px, 14vw, 128px); }
  .hero-sub { font-size:18px; color:#C9CACC; max-width:34em; margin:20px 0 26px; }
  .proof { list-style:none; padding:0; margin:28px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:14px; font-size:14px; color:#A8AAAD; }
  .proof li:last-child { grid-column:1/-1; }
  .proof b { display:block; font-family:"Barlow Condensed", Impact, sans-serif; font-size:32px; line-height:1; color:#fff; white-space:nowrap; }

  .service-list { display:grid; grid-template-columns:1fr; gap:2px; background:var(--ink); border:2px solid var(--ink); }
  .service { background:var(--paper); padding:22px 20px; }
  .service h3 { font-size:30px; margin-bottom:6px; }
  .service h3::before { content:""; display:inline-block; width:12px; height:12px; background:var(--accent); margin-right:10px; vertical-align:middle; transform:translateY(-3px); }
  .service p { margin:0; color:var(--muted); }

  .gallery { background:var(--soft); }
  .gallery-grid { display:grid; grid-auto-flow:column; grid-auto-columns:78%; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:10px; }
  .gallery figure { margin:0; scroll-snap-align:start; }
  .gallery img { width:100%; aspect-ratio:4/5; object-fit:cover; }
  .gallery figcaption { font-weight:600; font-size:15px; padding-top:8px; }

  .area-list { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
  .area-list li { font-family:"Barlow Condensed", Impact, sans-serif; font-weight:600; text-transform:uppercase; font-size:22px; padding:6px 14px; border:2px solid var(--ink); }
  .areas-note { color:var(--muted); margin:22px 0 0; }

  .reviews { background:var(--ink); color:#fff; }
  .review-list { display:grid; gap:14px; }
  .review { margin:0; padding:24px; border-left:6px solid var(--accent); background:#27282B; }
  .review .stars { color:var(--accent); letter-spacing:3px; }
  .review p { font-size:18px; margin:10px 0 12px; }
  .review footer { color:#A8AAAD; font-size:15px; font-weight:600; }

  .estimate { background:var(--accent); }
  .estimate-inner { display:grid; gap:30px; }
  .estimate-copy p { font-size:18px; margin:-14px 0 22px; }
  .estimate-copy .btn-call { background:var(--ink); color:#fff; }
  .estimate-form { background:#fff; padding:24px; display:grid; gap:14px; border:2px solid var(--ink); box-shadow:8px 8px 0 var(--ink); }
  .estimate-form label { display:grid; gap:6px; font-weight:600; font-size:15px; }
  .estimate-form input, .estimate-form select, .estimate-form textarea { font:inherit; padding:13px 14px; border:2px solid var(--ink); border-radius:0; background:#fff; color:var(--ink); width:100%; }
  .btn-send { background:var(--ink); color:#fff; }
  .form-status { margin:0; padding:12px 14px; font-size:15px; font-weight:600; }
  .form-status.is-ok { background:#E3F1E5; color:#1C4D27; }
  .form-status.is-error { background:#FBE4E1; color:#7F1D12; }

  .site-footer { background:var(--ink); color:#A8AAAD; padding:48px 0 112px; font-size:15px; }
  .site-footer .wrap { display:grid; gap:6px; }
  .site-footer .logo { color:var(--accent); margin-bottom:12px; }
  .site-footer p { margin:0 0 10px; }
  .fine { font-size:13px; }

  .mobile-bar { position:fixed; inset:auto 0 0; z-index:30; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--ink); border-top:4px solid var(--accent); }
  .mobile-bar .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mobile-bar .btn { min-height:48px; padding:12px; }

  @media (min-width: 860px) {
    section { padding:104px 0; }
    .head-call { display:inline-flex; }
    .hero-body { padding:80px 0 64px; }
    .hero-media img { aspect-ratio:21/8; }
    .proof { display:flex; gap:48px; }
    .service-list { grid-template-columns:repeat(3, 1fr); }
    .service { padding:30px 28px; }
    .gallery-grid { grid-auto-flow:row; grid-template-columns:repeat(3, 1fr); overflow:visible; }
    .gallery img { aspect-ratio:4/3; }
    .review-list { grid-template-columns:repeat(3, 1fr); }
    .estimate-inner { grid-template-columns:1fr 1fr; gap:72px; align-items:start; }
    .site-footer { padding-bottom:48px; }
    .site-footer .wrap { grid-template-columns:2fr 1.4fr 1.4fr; }
    .fine { grid-column:1/-1; }
    .mobile-bar { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
</style>
