<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --accent:#2F5D9E; --ink:#1C2740; --paper:#fff; --soft:#F1F4F8; --muted:#5A6478; --line:#DDE3EC; --radius:14px; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; font-family:"Bricolage Grotesque", system-ui, sans-serif; color:var(--ink); background:var(--paper); font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  img { display:block; max-width:100%; }
  a { color:inherit; }
  .wrap { width:min(1160px, 100% - 32px); margin-inline:auto; }
  h1,h2,h3 { line-height:1.05; margin:0; letter-spacing:-0.02em; }
  h2 { font-size:clamp(30px, 5vw, 48px); font-weight:800; margin-bottom:28px; }
  section { padding:72px 0; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }

  .btns { display:flex; flex-wrap:wrap; gap:10px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:15px 22px; border-radius:999px; font-weight:600; text-decoration:none; border:0; font:inherit; font-weight:600; cursor:pointer; min-height:52px; }
  .btn svg { width:20px; height:20px; flex:none; }
  .btn-call { background:var(--accent); color:#fff; }
  .btn-wa { background:#fff; color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink); }
  .btn-wa svg { color:#1FA855; }
  .btn:hover { filter:brightness(1.08); }

  .site-header { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .site-header .wrap { display:flex; align-items:center; justify-content:space-between; height:64px; gap:12px; }
  .logo { font-weight:800; font-size:20px; text-decoration:none; letter-spacing:-0.02em; display:flex; align-items:center; gap:10px; margin:0; }
  .logo::before { content:""; width:26px; height:26px; border-radius:6px; background:linear-gradient(90deg, #2F5D9E 0 33%, #E9E4D8 33% 66%, #B5693C 66%); flex:none; }
  .head-actions { display:flex; align-items:center; gap:8px; }
  .lang { background:none; border:1px solid var(--line); border-radius:999px; padding:8px 14px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; }
  .head-call { display:none; align-items:center; gap:6px; font-weight:600; text-decoration:none; }
  .head-call svg { width:18px; height:18px; color:var(--accent); }

  .hero { padding:16px 0 64px; display:grid; gap:34px; }
  .hero-media { width:min(1160px, 100% - 32px); margin-inline:auto; position:relative; }
  .hero-media img { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:var(--radius); }
  .proof b { white-space:nowrap; }
  .proof b { color:var(--ink); }
  .hero-media::after { content:""; position:absolute; left:-8px; bottom:-14px; width:62%; height:22px; border-radius:4px;
    background:linear-gradient(90deg, #2F5D9E 0 20%, #E9E4D8 20% 40%, #4C6B4F 40% 60%, #B5693C 60% 80%, #6E5A48 80%); }
  .hero-kicker { color:var(--accent); font-weight:600; margin:0 0 12px; }
  .hero h1 { font-size:clamp(40px, 9vw, 76px); font-weight:800; }
  .hero-sub { font-size:19px; color:var(--muted); max-width:34em; margin:18px 0 26px; }
  .proof { list-style:none; padding:0; margin:28px 0 0; display:flex; flex-wrap:wrap; gap:8px 22px; color:var(--muted); font-size:15px; }
  .proof b { color:var(--ink); }

  .services { background:var(--soft); }
  .service-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:18px; }
  .service { background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 0 var(--line);
    display:grid; grid-template-columns:58px 1fr; column-gap:18px; padding:18px 18px 18px 0; }
  .service::before { content:""; grid-row:1 / span 3; margin:-18px 0; background:var(--chip, var(--accent)); }
  .chip-name { display:block; font-size:13px; color:var(--muted); margin:0 0 4px; }
  .service h3 { font-size:21px; margin-bottom:6px; }
  .service p { margin:0; color:var(--muted); }

  .gallery-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .gallery img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; }

  .reviews { background:var(--ink); color:#fff; }
  .review-list { display:grid; gap:18px; }
  .review { margin:0; padding:26px; border-radius:var(--radius); background:rgba(255,255,255,.06); }
  .review .stars { color:#F5C04A; letter-spacing:2px; }
  .review p { font-size:19px; margin:10px 0 14px; }
  .review footer { color:#AEB8CC; font-size:15px; }

  .area-list { list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:10px; }
  .area-list li { padding:10px 16px; border-radius:999px; background:var(--soft); font-weight:600; }
  .areas-note { color:var(--muted); margin:20px 0 0; }

  .estimate { background:var(--soft); }
  .estimate-inner { display:grid; gap:32px; }
  .estimate-copy p { color:var(--muted); font-size:18px; margin:-12px 0 22px; }
  .estimate-form { background:#fff; padding:24px; border-radius:var(--radius); display:grid; gap:14px; }
  .estimate-form label { display:grid; gap:6px; font-weight:600; font-size:15px; }
  .estimate-form input, .estimate-form select, .estimate-form textarea { font:inherit; font-weight:400; padding:13px 14px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); width:100%; }
  .btn-send { background:var(--accent); color:#fff; border-radius:10px; }
  .form-status { margin:0; padding:12px 14px; border-radius:10px; font-size:15px; }
  .form-status.is-ok { background:#E6F4EA; color:#1D5B2E; }
  .form-status.is-error { background:#FDECEC; color:#8A1F1F; }

  .site-footer { padding:48px 0 110px; border-top:1px solid var(--line); color:var(--muted); font-size:15px; }
  .site-footer .wrap { display:grid; gap:8px; }
  .site-footer .logo { color:var(--ink); }
  .site-footer p { margin:0 0 8px; }
  .fine { font-size:13px; }

  .mobile-bar { position:fixed; left:0; right:0; bottom:0; z-index:30; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
  .mobile-bar .btns { display:grid; grid-template-columns:1fr 1fr; }
  .mobile-bar .btn { padding:12px; min-height:48px; }

  @media (min-width: 860px) {
    section { padding:104px 0; }
    .head-call { display:inline-flex; }
    .hero { grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:center; width:min(1160px, 100% - 32px); margin-inline:auto; padding:56px 0 96px; gap:56px; }
    .hero-body { width:auto; margin:0; }
    .hero-media { order:2; width:auto; margin:0; }
    .hero-media img { aspect-ratio:4/5; }
    .service { display:block; padding:0 22px 24px; }
    .service::before { display:block; height:110px; margin:0 -22px 14px; }
    .gallery-grid { grid-template-columns:repeat(3, 1fr); gap:14px; }
    .review-list { grid-template-columns:repeat(3, 1fr); }
    .estimate-inner { grid-template-columns:1fr 1fr; align-items:start; gap:64px; }
    .site-footer { padding-bottom:48px; }
    .site-footer .wrap { grid-template-columns:2fr 1.4fr 1.4fr; }
    .fine { grid-column:1/-1; }
    .mobile-bar { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
</style>
